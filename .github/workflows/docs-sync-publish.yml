name: Mirror English documentation
on:
  push:
    branches: [master]
    paths: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-sync-publish
  cancel-in-progress: false
jobs:
  mirror:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      SYNC_TOKEN: ${{ secrets.FLOPS_AGENT_DOCS_SYNC_TOKEN }}
    steps:
      - name: Skip optional push mirror when token is absent
        if: env.SYNC_TOKEN == ''
        run: echo "FLOPS_AGENT_DOCS_SYNC_TOKEN not configured; skipping push-based mirror. The docs repo pulls on a schedule instead."
      - uses: actions/checkout@v4
        if: env.SYNC_TOKEN != ''
        with:
          path: source
          # Always mirror current default-branch content, even when rerunning an old job.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@v4
        if: env.SYNC_TOKEN != ''
        with:
          repository: Xenotech-Studio/flops-agent-docs
          ref: main
          path: target
          # Fine-grained PAT: target repository only, Contents: read and write.
          token: ${{ env.SYNC_TOKEN }}
      - name: Mirror docs only and publish a non-empty commit
        if: env.SYNC_TOKEN != ''
        shell: bash
        run: |
          bash source/scripts/mirror-docs.sh "$PWD/source" "$PWD/target"
          source_sha=$(git -C source rev-parse HEAD)
          cd target
          git add -A -- docs/en
          if git diff --cached --quiet; then
            echo "English mirror unchanged; no commit."
            exit 0
          fi
          git config user.name 'flops-agent-docs-sync[bot]'
          git config user.email 'flops-agent-docs-sync[bot]@users.noreply.github.com'
          git commit -m "chore(sync): mirror docs from Xenotech-Studio/flops-agent@$source_sha"
          git push origin HEAD:main
