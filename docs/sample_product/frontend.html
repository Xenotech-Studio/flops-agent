<!-- Client layer: SSE consumption, reconnect cursor, and cancellation button.

  The framework provides WireCodec; clients receive SSE bytes and products may
  customize the codec. Runtime.sse_stream serializes framework Python events to
  JSON. This file assumes the product has connected /chat and /cancel to HTTP. -->
<!doctype html>
<meta charset="utf-8">
<title>Sample Product - Frontend</title>
<style>
  body { font: 14px/1.6 system-ui; max-width: 640px; margin: 40px auto; }
  #log { white-space: pre-wrap; background: #f6f8fa; padding: 12px; border-radius: 8px; }
  button { padding: 6px 14px; }
</style>

<h3>Sample conversation</h3>
<input id="text" value="List the directory" style="width: 60%">
<button onclick="send()">Send</button>
<button onclick="cancel()">Stop</button>
<div id="log"></div>

<script>
const log = (s) => document.getElementById("log").textContent += s + "\n";

// Every live frame has a cursor. Remember the latest one and send it back as
// from_cursor on reconnect; frame counts do not match coalesced replay frames.
let lastCursor = 0;
let controller = null;

async function send() {
  const text = document.getElementById("text").value;
  controller = new AbortController();
  // The POST body and URL are product protocol. Standard framework events use
  // stable snake_case types; products maintain mappings for custom codecs.
  const resp = await fetch(`/chat?session=demo&from_cursor=${lastCursor}`, {
    method: "POST",
    body: JSON.stringify({ text }),
    signal: controller.signal,
  });

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    // Parse frames separated by \n\n.
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 2);
      if (frame.startsWith("data: ")) handleEvent(JSON.parse(frame.slice(6)));
    }
  }
}

function handleEvent(ev) {
  // Standard WireCodec uses types such as text_delta, tool_result, and
  // loop_finished; custom codecs follow the product protocol.
  if (ev.cursor !== undefined) lastCursor = ev.cursor;
  log(`${ev.type}: ${ev.text || ev.message || ev.repr || ""}`);
}

async function cancel() {
  // Ask the server to stop this conversation. It calls run.stop() locally or
  // records a shared-store intent; the frontend only needs the session ID.
  if (controller) controller.abort();          // Disconnect the local SSE stream.
  await fetch(`/cancel?session=demo`, { method: "POST" });
  log("(stop requested)");
}
</script>
