# flops_agent — independently installable service-style agent kernel.
#
# Source layout: the importable package lives under ``src/flops_agent``.
# Install it (including in CI) before importing or testing it:
#
#     pip install -e ".[test,providers]"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flops-agent"
dynamic = ["version"]
description = "FLOPS agent kernel — a service-style agent loop (runs, sessions, tools, suspension, recovery)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
authors = [{name = "Xenotech Studio"}]
keywords = ["agent", "llm", "framework", "streaming", "sse"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
    "typing_extensions>=4.4",   # @override (PEP 698); built into typing on 3.12+.
]

[project.urls]
Homepage = "https://github.com/Xenotech-Studio/flops-agent"
Repository = "https://github.com/Xenotech-Studio/flops-agent"

[project.optional-dependencies]
# Bundled starter LLM client (SampleDeepseekClient, using the OpenAI protocol).
providers = ["httpx>=0.24"]
# Tooling needed to verify this repository without the Flops monorepo.
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
flops_agent = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "flops_agent.__version__"}
