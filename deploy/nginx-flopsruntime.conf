# flops-agent.xenotech.studio / flopsruntime.xenotech.studio — static React/Vite site
# Included from /home/ubuntu/nginx.conf; SSL uses the *.xenotech.studio wildcard certificate.

server {
    listen 80;
    server_name flops-agent.xenotech.studio flopsruntime.xenotech.studio;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flops-agent.xenotech.studio flopsruntime.xenotech.studio;
    root /home/ubuntu/flowseries/flops-agent/website/dist;
    index index.html;

    ssl_certificate /home/ubuntu/__ssl__/xenotech.studio/xenotech.studio_bundle.pem;
    ssl_certificate_key /home/ubuntu/__ssl__/xenotech.studio/xenotech.studio.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
