# flopsruntime.xenotech.studio — static React/Vite site (no backend or service port)
# Include this file from /home/ubuntu/nginx.conf after DNS is in place.

server {
    listen 80;
    server_name flopsruntime.xenotech.studio;
    root /home/ubuntu/flowseries/flops-agent/website/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 443 ssl;
    server_name flopsruntime.xenotech.studio;
    root /home/ubuntu/flowseries/flops-agent/website/dist;
    index index.html;

    ssl_certificate /home/ubuntu/__ssl__/xenotech.studio/xenotech.studio_bundle.pem;
    ssl_certificate_key /home/ubuntu/__ssl__/xenotech.studio/xenotech.studio.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
